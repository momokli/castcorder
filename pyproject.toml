[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zukka-wuerfel"
version = "0.1.0"
description = "Raspberry-Pi-Würfel als Live-DJ-Encoder für radio.zukkafabrik.de"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zukka-wuerfel = "zukka_wuerfel.__main__:main"

[tool.setuptools]
packages = ["zukka_wuerfel"]
