[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castcorder"
version = "0.1.0"
description = "Raspberry-Pi-Tapedeck als Live-DJ-Encoder für radio.zukkafabrik.de"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
castcorder = "castcorder.__main__:main"

[tool.setuptools]
packages = ["castcorder"]
