# radio zukka Würfel — Beispielkonfiguration
#
# Auf dem Pi nach /etc/zukka-wuerfel/config.toml kopieren (macht das
# Installationsskript automatisch, falls noch keine Datei existiert).

[input]
# ALSA-Capture-Gerät des USB-Audio-Interfaces/ADC. `arecord -l` zeigt die Karten.
# Beispiel USB-Interface: "plughw:CARD=Device,DEV=0"
# Beispiel HiFiBerry/ADC-HAT: "plughw:CARD=sndrpihifiberry,DEV=0"
device = "plughw:CARD=Device,DEV=0"
sample_rate = 44100
channels = 2
extra_args = []

[stream]
# Werte aus AzuraCast → Station → Streamers/DJs → "Icecast Clients".
# Port und Mount Name EXAKT von dort übernehmen; 8005 und "/" sind nur typische
# Beispiele, keine Garantie für deine Station.
host = "cast.zukkafabrik.de"
port = 8005
mount = "/"
# Streamer-/DJ-Benutzername aus AzuraCast (nicht der Admin-Account).
username = "momo"
# Passwort steht NICHT hier, sondern in dieser Umgebungsvariable.
password_env = "ZUKKA_STREAMER_PASSWORD"
# Quelle läuft normalerweise unverschlüsselt auf dem DJ-Port; TLS nur wenn
# dein AzuraCast-Setup das explizit anbietet.
tls = false
name = "radio zukka live"
description = "Live from the Zukka Wuerfel"
genre = ""
url = "https://radio.zukkafabrik.de"
public = false

[encoder]
# AzuraCast-Station ist 192 kbps MP3; 192 ist ein guter Startwert.
bitrate = 192
extra_args = []

[leds]
# Pegelanzeige auf den Würfel-Pips (aus dem ffmpeg-Eingang gemessen).
vu = true
vu_min_db = -48
vu_max_db = 0
# Wie schnell die Pips nach einem Peak wieder abfallen (Pips pro Sekunde).
vu_decay_per_second = 8

[gpio]
# BCM-Nummern (nicht die physischen Header-Pins!).
button_pin = 17
button_led_pin = 27
# false = Knopf gegen GND, interner Pull-up. true = Knopf gegen 3V3.
button_active_high = false
button_bounce_time = 0.05

# Sieben LEDs in Würfel-Anordnung:
#   tl   tr
#     ml c mr
#   bl   br
# Reihenfolge: tl, tr, ml, c, mr, bl, br
pips = [5, 6, 16, 22, 23, 24, 25]
# Keine Würfel-LEDs? Dann: pips = []

[behavior]
connect_timeout_seconds = 20
retry_delay_seconds = 8
max_retries = 3
min_connecting_display_seconds = 0.9
